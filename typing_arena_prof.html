<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ TYPING ARENA - VERSIONE PROF ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        body {
            background: #0a0e27;
            font-family: 'Press Start 2P', monospace;
            color: #00ff87;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #1a0033 0%, #0a0e27 50%, #001a33 100%);
            border: 4px solid #ff006e;
            border-radius: 20px;
            box-shadow: 0 0 30px #ff006e, inset 0 0 30px rgba(255, 0, 110, 0.3);
            animation: borderPulse 2s ease-in-out infinite;
            position: relative;
        }

        @keyframes borderPulse {
            0%, 100% { box-shadow: 0 0 30px #ff006e, inset 0 0 30px rgba(255, 0, 110, 0.3); }
            50% { box-shadow: 0 0 50px #ff006e, inset 0 0 50px rgba(255, 0, 110, 0.5); }
        }

        h1 {
            font-size: 2.5em;
            color: #00ff87;
            text-shadow: 
                4px 4px 0 #ff006e,
                0 0 20px #00ff87;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 0.8em;
            color: #ffbe0b;
            text-shadow: 0 0 10px #ffbe0b;
        }

        .section-box {
            background: rgba(26, 26, 46, 0.8);
            border: 3px solid #00f5ff;
            border-radius: 0;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 
                8px 8px 0 rgba(0, 245, 255, 0.3),
                0 0 30px rgba(0, 245, 255, 0.3);
        }

        .section-title {
            font-size: 1em;
            color: #00ff87;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff87;
            text-align: center;
        }

        #csvInput {
            width: 100%;
            height: 120px;
            background: #0a0e27;
            border: 2px solid #00f5ff;
            color: #00ff87;
            font-family: monospace;
            padding: 15px;
            border-radius: 0;
            font-size: 0.7em;
            resize: vertical;
        }

        .load-btn, .export-btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: linear-gradient(45deg, #ff006e, #fb5607);
            border: 3px solid #0a0e27;
            color: white;
            font-family: 'Press Start 2P';
            font-size: 0.7em;
            cursor: pointer;
            border-radius: 0;
            transition: all 0.3s;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        }

        .export-btn {
            background: linear-gradient(45deg, #00ff87, #00f5ff);
            margin-top: 20px;
        }

        .load-btn:hover, .export-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
        }

        .load-btn:active, .export-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            padding: 12px 20px;
            background: #1a1a2e;
            border: 3px solid #00f5ff;
            color: #00f5ff;
            cursor: pointer;
            font-size: 0.55em;
            border-radius: 0;
            transition: all 0.3s;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
        }

        .tab:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.3);
        }

        .tab.active {
            background: #00f5ff;
            color: #0a0e27;
            border-color: #00ff87;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 rgba(0, 245, 255, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(26, 26, 46, 0.8);
            border: 3px solid #ff006e;
            border-radius: 0;
            padding: 20px;
            text-align: center;
            box-shadow: 
                6px 6px 0 rgba(255, 0, 110, 0.3),
                0 0 30px rgba(255, 0, 110, 0.4);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 
                9px 9px 0 rgba(255, 0, 110, 0.3),
                0 10px 40px rgba(255, 0, 110, 0.6);
        }

        .stat-card-title {
            font-size: 0.55em;
            color: #ffbe0b;
            margin-bottom: 12px;
        }

        .stat-card-value {
            font-size: 2.2em;
            color: #00ff87;
            text-shadow: 0 0 10px #00ff87;
        }

        /* LEADERBOARD WITH GRADES */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .leaderboard-title {
            font-size: 1.2em;
            color: #ffbe0b;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ffbe0b;
            padding-bottom: 15px;
            border-bottom: 3px solid #ffbe0b;
        }

        .rank-item {
            background: rgba(26, 26, 46, 0.8);
            border: 3px solid #00f5ff;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 80px 1fr 150px 100px;
            gap: 20px;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 4px 4px 0 rgba(0, 245, 255, 0.3);
            opacity: 0;
            animation: slideIn 0.5s forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .rank-item:hover {
            transform: translateX(5px);
            box-shadow: 6px 6px 0 rgba(0, 245, 255, 0.5);
        }

        .rank-item.top-1 {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .rank-item.top-2 {
            border-color: #c0c0c0;
            background: rgba(192, 192, 192, 0.1);
        }

        .rank-item.top-3 {
            border-color: #cd7f32;
            background: rgba(205, 127, 50, 0.1);
        }

        .rank-number {
            font-size: 1.8em;
            color: #00ff87;
            text-shadow: 0 0 10px #00ff87;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-name {
            font-size: 0.9em;
            color: #00f5ff;
        }

        .player-stats {
            font-size: 0.5em;
            color: #ffbe0b;
        }

        .player-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.5em;
        }

        .detail-label {
            color: #a0aec0;
        }

        .detail-value {
            color: #00ff87;
            font-weight: bold;
        }

        /* GRADE DISPLAY */
        .grade-display {
            text-align: center;
            padding: 15px;
            background: rgba(255, 215, 0, 0.2);
            border: 3px solid #ffd700;
            border-radius: 0;
            box-shadow: 
                4px 4px 0 rgba(255, 215, 0, 0.3),
                0 0 20px rgba(255, 215, 0, 0.4);
        }

        .grade-number {
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
            font-weight: bold;
        }

        .grade-label {
            font-size: 0.5em;
            color: #ffbe0b;
            margin-top: 5px;
        }

        /* LEVEL BADGES */
        .level-badge {
            padding: 8px 15px;
            border-radius: 0;
            font-size: 0.7em;
            text-align: center;
            border: 3px solid;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
        }

        .level-badge-wanted { background: rgba(255, 107, 107, 0.2); border-color: #ff6b6b; color: #ff6b6b; }
        .level-badge-newbie { background: rgba(160, 174, 192, 0.2); border-color: #a0aec0; color: #a0aec0; }
        .level-badge-typist { background: rgba(72, 187, 120, 0.2); border-color: #48bb78; color: #48bb78; }
        .level-badge-speedster { background: rgba(66, 153, 225, 0.2); border-color: #4299e1; color: #4299e1; }
        .level-badge-advanced { background: rgba(159, 122, 234, 0.2); border-color: #9f7aea; color: #9f7aea; }
        .level-badge-legend { background: rgba(237, 100, 166, 0.2); border-color: #ed64a6; color: #ed64a6; }
        .level-badge-master { background: rgba(255, 215, 0, 0.2); border-color: #ffd700; color: #ffd700; animation: masterGlow 2s infinite; }

        @keyframes masterGlow {
            0%, 100% { box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 215, 0, 0.8); }
        }

        /* CLASS STATS */
        .class-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .class-stat-card {
            background: rgba(26, 26, 46, 0.9);
            border: 3px solid #9f7aea;
            border-radius: 0;
            padding: 20px;
            box-shadow: 
                6px 6px 0 rgba(159, 122, 234, 0.3),
                0 0 30px rgba(159, 122, 234, 0.4);
            transition: all 0.3s;
        }

        .class-stat-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 
                9px 9px 0 rgba(159, 122, 234, 0.3),
                0 10px 40px rgba(159, 122, 234, 0.6);
        }

        .class-stat-title {
            font-size: 1.2em;
            color: #9f7aea;
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #9f7aea;
        }

        .class-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.6em;
            border-bottom: 1px solid rgba(159, 122, 234, 0.2);
        }

        .class-stat-label {
            color: #ffbe0b;
        }

        .class-stat-value {
            color: #00ff87;
            font-weight: bold;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0a0e27;
            border: 4px solid #00f5ff;
            border-radius: 0;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.6);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff006e;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            font-size: 1.5em;
            cursor: pointer;
            font-family: 'Press Start 2P';
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #fb5607;
            transform: scale(1.1);
        }

        .modal-title {
            font-size: 1.2em;
            color: #00ff87;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00ff87;
        }

        .chart-container {
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid #00f5ff;
            padding: 20px;
            margin: 20px 0;
        }

        .level-display {
            background: rgba(26, 26, 46, 0.8);
            border: 3px solid #ff006e;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
        }

        .level-display-title {
            font-size: 0.7em;
            color: #ffbe0b;
            margin-bottom: 15px;
        }

        .level-display-badge {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 15px auto;
            display: inline-block;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item-label {
            font-size: 0.5em;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .stat-item-value {
            font-size: 1.2em;
            color: #00ff87;
            text-shadow: 0 0 10px #00ff87;
        }

        .test-entry {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 12px;
            background: rgba(26, 26, 46, 0.6);
            border: 2px solid #00f5ff;
            margin-bottom: 10px;
            font-size: 0.6em;
            align-items: center;
        }

        .test-date {
            color: #ffbe0b;
            font-weight: bold;
        }

        .suggestion-box {
            background: rgba(255, 190, 11, 0.2);
            border: 3px solid #ffbe0b;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
            font-size: 0.7em;
            color: #ffbe0b;
            box-shadow: 4px 4px 0 rgba(255, 190, 11, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ TYPING ARENA ⚡</h1>
            <div class="subtitle">👨‍🏫 VERSIONE PROFESSORE 👩‍🏫</div>
        </header>

        <div class="section-box" style="text-align: center;">
            <div class="section-title">📊 GESTIONE VOTI</div>
            <button class="export-btn" onclick="exportGrades()" id="exportBtn">📥 ESPORTA VOTI PER REGISTRO</button>
            <div style="font-size: 0.6em; color: #ffbe0b; margin-top: 15px;">
                💡 I dati vengono caricati automaticamente da typing_data.csv
            </div>
        </div>

        <div id="statsContainer"></div>

        <div id="tabsContainer" class="tabs"></div>

        <div id="leaderboardContainer"></div>
    </div>

    <!-- Modal -->
    <div id="trendModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let allData = [];
        let allClasses = [];
        let currentView = 'overall';

        // AUTO-LOAD CSV dalla stessa cartella all'avvio!
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Carica typing_data.csv dalla stessa directory
                const response = await fetch('./typing_data.csv');
                if (response.ok) {
                    const csvText = await response.text();
                    parseAndLoadCSV(csvText);
                    console.log('✅ CSV caricato automaticamente!');
                } else {
                    showError('CSV non trovato nella stessa cartella.');
                }
            } catch (error) {
                showError('Errore nel caricamento del CSV: ' + error.message);
            }
        });

        function showError(message) {
            document.getElementById('statsContainer').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card" style="grid-column: 1 / -1;">
                        <div class="stat-card-title">⚠️ ERRORE</div>
                        <div style="font-size: 0.6em; color: #ff006e; margin-top: 10px;">${message}</div>
                        <div style="font-size: 0.5em; color: #ffbe0b; margin-top: 10px;">
                            Verifica che il file typing_data.csv sia nella stessa cartella dell'HTML.
                        </div>
                    </div>
                </div>
            `;
        }

        function parseAndLoadCSV(csvText) {
            const lines = csvText.split('\n').filter(l => l.trim());
            allData = [];
            const classSet = new Set();

            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if (parts.length < 6) continue;
                
                // Supporta sia formato vecchio (8 colonne) che nuovo (6 colonne)
                let classe, iniziali, wpm, accuracy;
                
                if (parts.length >= 8) {
                    // Formato vecchio: Data,Classe,Cognome,Nome,Iniziali,Genere,WPM,Accuracy
                    classe = parts[1].trim();
                    iniziali = parts[4].trim();
                    wpm = parseInt(parts[6]);
                    accuracy = parseInt(parts[7]);
                } else {
                    // Formato nuovo: Data,Classe,Iniziali,Genere,WPM,Accuracy
                    classe = parts[1].trim();
                    iniziali = parts[2].trim();
                    wpm = parseInt(parts[4]);
                    accuracy = parseInt(parts[5]);
                }
                
                if (!iniziali || !classe || isNaN(wpm) || wpm === 0) continue;
                if (!isNaN(accuracy) && accuracy < 70) continue;

                allData.push({ classe, iniziali, wpm, accuracy: isNaN(accuracy) ? 100 : accuracy });
                classSet.add(classe);
            }

            if (allData.length === 0) {
                showError('Nessun dato valido trovato nel CSV!');
                return;
            }

            allClasses = Array.from(classSet).sort();
            createTabs();
            renderView();
        }

        function exportGrades() {
            if (allData.length === 0) {
                alert('⚠️ Carica prima i dati!');
                return;
            }

            const students = aggregateData(allData);
            students.sort((a, b) => {
                if (a.classe !== b.classe) return a.classe.localeCompare(b.classe);
                return a.iniziali.localeCompare(b.iniziali);
            });

            let csvOutput = 'Classe,Iniziali,WPM Medio,N. Test,Miglioramento,VOTO\n';
            students.forEach(s => {
                csvOutput += `${s.classe},${s.iniziali},${s.avgWpm},${s.numTests},+${s.improvement},${s.grade}\n`;
            });

            const blob = new Blob([csvOutput], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'voti_typing_arena.csv';
            a.click();
            window.URL.revokeObjectURL(url);

            alert('📊 File CSV esportato! Controlla i download.');
        }

        function getSpeedGrade(wpm) {
            if (wpm === 0) return 0;
            if (wpm <= 15) return 4;
            if (wpm <= 22) return 5;
            if (wpm <= 28) return 6;
            if (wpm <= 35) return 7;
            if (wpm <= 45) return 8;
            if (wpm <= 60) return 9;
            return 10;
        }

        function getConsistencyGrade(tests) {
            if (tests === 0) return 0;
            if (tests === 1) return 4;
            if (tests === 2) return 5;
            if (tests === 3) return 6;
            if (tests <= 5) return 7;
            if (tests <= 7) return 8;
            if (tests <= 10) return 9;
            return 10;
        }

        function getImprovementGrade(improvement, numTests) {
            if (numTests <= 1) return 5;
            if (improvement <= 0) return 5;
            if (improvement <= 5) return 6;
            if (improvement <= 10) return 7;
            if (improvement <= 15) return 8;
            if (improvement <= 20) return 9;
            return 10;
        }

        function calculateGrade(speedGrade, consistencyGrade, improvementGrade) {
            const finalScore = (speedGrade * 0.4) + (consistencyGrade * 0.4) + (improvementGrade * 0.2);
            return Math.round(finalScore);
        }

        function getGradeFromScore(score) {
            if (score < 5) return { level: '❌ WANTED', badgeClass: 'level-badge-wanted', barClass: 'histogram-bar-wanted' };
            if (score < 5.5) return { level: '🆕 NEWBIE', badgeClass: 'level-badge-newbie', barClass: 'histogram-bar-newbie' };
            if (score < 6.5) return { level: '⌨️ TYPIST', badgeClass: 'level-badge-typist', barClass: 'histogram-bar-typist' };
            if (score < 7.5) return { level: '⚡ SPEEDSTER', badgeClass: 'level-badge-speedster', barClass: 'histogram-bar-speedster' };
            if (score < 8.5) return { level: '🎓 ADVANCED', badgeClass: 'level-badge-advanced', barClass: 'histogram-bar-advanced' };
            if (score < 9.5) return { level: '👑 LEGEND', badgeClass: 'level-badge-legend', barClass: 'histogram-bar-legend' };
            return { level: '🔥 MASTER', badgeClass: 'level-badge-master', barClass: 'histogram-bar-master' };
        }

        function aggregateData(data) {
            const byStudent = {};
            
            data.forEach(d => {
                const key = `${d.classe}-${d.iniziali}`;
                if (!byStudent[key]) {
                    byStudent[key] = {
                        classe: d.classe,
                        iniziali: d.iniziali,
                        tests: [],
                        totalWpm: 0,
                        firstWpm: d.wpm,
                        maxWpm: d.wpm
                    };
                }
                byStudent[key].tests.push(d);
                byStudent[key].totalWpm += d.wpm;
                byStudent[key].firstWpm = Math.min(byStudent[key].firstWpm, d.wpm);
                byStudent[key].maxWpm = Math.max(byStudent[key].maxWpm, d.wpm);
            });

            return Object.values(byStudent).map(student => {
                const numTests = student.tests.length;
                const avgWpm = Math.round(student.totalWpm / numTests);
                const lastWpm = student.tests[student.tests.length - 1].wpm;
                const improvement = lastWpm - student.firstWpm;

                const speedGrade = getSpeedGrade(avgWpm);
                const consistencyGrade = getConsistencyGrade(numTests);
                const improvementGrade = getImprovementGrade(improvement, numTests);

                const finalScore = (speedGrade * 0.4) + (consistencyGrade * 0.4) + (improvementGrade * 0.2);
                const grade = calculateGrade(speedGrade, consistencyGrade, improvementGrade);
                const gradeInfo = getGradeFromScore(finalScore);

                return {
                    ...student,
                    avgWpm,
                    numTests,
                    improvement,
                    finalScore,
                    grade,
                    ...gradeInfo
                };
            }).sort((a, b) => b.finalScore - a.finalScore);
        }

        function createTabs() {
            let html = `
                <div class="tab active" data-view="overall">🏆 CLASSIFICA</div>
                <div class="tab" data-view="classstats">📈 MEDIE CLASSI</div>
            `;
            
            allClasses.forEach(cls => {
                html += `<div class="tab" data-view="${cls}">${cls}</div>`;
            });

            document.getElementById('tabsContainer').innerHTML = html;

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentView = tab.dataset.view;
                    renderView();
                });
            });
        }

        function renderView() {
            if (currentView === 'classstats') {
                renderClassStats();
            } else {
                const filteredData = currentView === 'overall' 
                    ? allData 
                    : allData.filter(d => d.classe === currentView);
                
                const students = aggregateData(filteredData);
                renderStats(students);
                renderLeaderboard(students);
            }
        }

        function renderStats(students) {
            const totalStudents = students.length;
            const avgWpmOverall = students.length > 0 ? (students.reduce((sum, s) => sum + s.avgWpm, 0) / students.length).toFixed(1) : 0;
            const totalTests = students.reduce((sum, s) => sum + s.numTests, 0);
            const avgGrade = students.length > 0 ? (students.reduce((sum, s) => sum + s.grade, 0) / students.length).toFixed(1) : 0;

            document.getElementById('statsContainer').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-title">👥 STUDENTI</div>
                        <div class="stat-card-value">${totalStudents}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-title">⚡ WPM MEDIO</div>
                        <div class="stat-card-value">${avgWpmOverall}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-title">📝 TEST TOTALI</div>
                        <div class="stat-card-value">${totalTests}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-title">📊 VOTO MEDIO</div>
                        <div class="stat-card-value">${avgGrade}</div>
                    </div>
                </div>
            `;
        }

        function renderLeaderboard(students) {
            let title = currentView === 'overall' ? '🏆 CLASSIFICA GENERALE' : `🎮 CLASSIFICA ${currentView}`;
            let html = `<div class="leaderboard"><div class="leaderboard-title">${title}</div>`;

            students.forEach((s, i) => {
                const rank = i + 1;
                const topClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';

                html += `
                    <div class="rank-item ${topClass}" style="animation-delay: ${i * 0.05}s" onclick="showDetails('${s.classe}', '${s.iniziali}')">
                        <div style="text-align: center;">
                            <div class="rank-number">#${rank}</div>
                            <div style="font-size: 0.5em; color: #ffbe0b; margin-top: 5px;">${s.numTests} test</div>
                        </div>
                        <div class="player-info">
                            <div class="player-name">${s.iniziali}</div>
                            <div class="player-stats">${s.classe} • ${s.avgWpm} WPM medio</div>
                        </div>
                        <div class="player-details">
                            <div class="detail-row">
                                <span class="detail-label">WPM medio</span>
                                <span class="detail-value">${s.avgWpm}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Miglioramento</span>
                                <span class="detail-value">+${s.improvement}</span>
                            </div>
                        </div>
                        <div class="grade-display">
                            <div class="grade-number">${s.grade}</div>
                            <div class="grade-label">VOTO</div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            document.getElementById('leaderboardContainer').innerHTML = html;
        }

        function renderClassStats() {
            const classstats = {};
            
            allClasses.forEach(cls => {
                const classData = allData.filter(d => d.classe === cls);
                const students = aggregateData(classData);
                
                classstats[cls] = {
                    students: students.length,
                    avgWpm: students.length > 0 ? (students.reduce((sum, s) => sum + s.avgWpm, 0) / students.length).toFixed(1) : 0,
                    totalTests: students.reduce((sum, s) => sum + s.numTests, 0),
                    avgTests: students.length > 0 ? (students.reduce((sum, s) => sum + s.numTests, 0) / students.length).toFixed(1) : 0,
                    avgGrade: students.length > 0 ? (students.reduce((sum, s) => sum + s.grade, 0) / students.length).toFixed(1) : 0
                };
            });

            let html = `<div class="class-stats-grid">`;

            Object.keys(classstats).sort().forEach(cls => {
                const stats = classstats[cls];
                html += `
                    <div class="class-stat-card">
                        <div class="class-stat-title">${cls}</div>
                        <div class="class-stat-row">
                            <span class="class-stat-label">Studenti</span>
                            <span class="class-stat-value">${stats.students}</span>
                        </div>
                        <div class="class-stat-row">
                            <span class="class-stat-label">WPM medio</span>
                            <span class="class-stat-value">${stats.avgWpm}</span>
                        </div>
                        <div class="class-stat-row">
                            <span class="class-stat-label">Test totali</span>
                            <span class="class-stat-value">${stats.totalTests}</span>
                        </div>
                        <div class="class-stat-row">
                            <span class="class-stat-label">Test per studente</span>
                            <span class="class-stat-value">${stats.avgTests}</span>
                        </div>
                        <div class="class-stat-row">
                            <span class="class-stat-label">⭐ VOTO MEDIO</span>
                            <span class="class-stat-value">${stats.avgGrade}</span>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            document.getElementById('statsContainer').innerHTML = '';
            document.getElementById('leaderboardContainer').innerHTML = html;
        }

        function showDetails(classe, iniziali) {
            const studentTests = allData.filter(d => d.classe === classe && d.iniziali === iniziali);
            if (studentTests.length === 0) return;

            const students = aggregateData(allData);
            const s = students.find(st => st.classe === classe && st.iniziali === iniziali);

            document.getElementById('modalTitle').textContent = `${iniziali} - ${classe}`;

            let html = `
                <div class="level-display">
                    <div class="level-display-title">VALUTAZIONE STUDENTE</div>
                    <div class="grade-display" style="margin: 20px auto; max-width: 200px;">
                        <div class="grade-number" style="font-size: 3em;">${s.grade}</div>
                        <div class="grade-label">VOTO FINALE</div>
                    </div>
                    <div class="level-display-badge ${s.badgeClass}">
                        ${s.level}
                    </div>
                    <div class="stats-summary">
                        <div class="stat-item">
                            <div class="stat-item-label">Test fatti</div>
                            <div class="stat-item-value">${s.numTests}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-item-label">WPM medio</div>
                            <div class="stat-item-value">${s.avgWpm}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-item-label">Miglioramento</div>
                            <div class="stat-item-value">+${s.improvement}</div>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <svg viewBox="0 0 800 200" style="width: 100%; height: 100%;">
            `;

            const maxWpm = Math.max(...studentTests.map(t => t.wpm));
            const minWpm = Math.min(...studentTests.map(t => t.wpm));
            const range = maxWpm - minWpm || 10;

            const points = studentTests.map((t, i) => {
                const x = 50 + (i * (700 / (studentTests.length - 1 || 1)));
                const y = 180 - ((t.wpm - minWpm) / range * 150);
                return `${x},${y}`;
            }).join(' ');

            html += `<polyline points="${points}" stroke="#00ff87" stroke-width="4" fill="none" filter="drop-shadow(0 0 8px #00ff87)" />`;

            studentTests.forEach((t, i) => {
                const x = 50 + (i * (700 / (studentTests.length - 1 || 1)));
                const y = 180 - ((t.wpm - minWpm) / range * 150);
                html += `
                    <circle cx="${x}" cy="${y}" r="6" fill="#ff006e" filter="drop-shadow(0 0 6px #ff006e)" />
                    <text x="${x}" y="195" text-anchor="middle" fill="#ffbe0b" font-size="10" font-family="Press Start 2P">${t.wpm}</text>
                `;
            });

            html += `</svg></div>`;

            html += '<div style="margin-top: 25px;"><div style="font-size: 0.75em; color: #00f5ff; margin-bottom: 15px; text-align: center;">📋 STORICO TEST</div>';
            studentTests.forEach((t, i) => {
                html += `
                    <div class="test-entry">
                        <div class="test-date">Test #${i + 1}</div>
                        <div style="color: #00f5ff;">Classe ${t.classe}</div>
                        <div></div>
                        <div style="font-weight: 600; color: #00ff87;">WPM: ${t.wpm}</div>
                        <div style="color: #ffbe0b;">Acc: ${t.accuracy}%</div>
                    </div>
                `;
            });
            html += '</div>';

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('trendModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('trendModal').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
